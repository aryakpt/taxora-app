# Deploys the API to its Hugging Face Space after a merge to main (deploy/huggingface.py push).
# Needs the HF_TOKEN secret and the HF_SPACE variable: `make deploy-github` sets both.
name: Deploy API

on:
  push:
    branches: [main]
    paths: ["backend/**", "deploy/huggingface.py", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.HF_SPACE != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install "huggingface_hub>=0.24,<2"
      - run: python deploy/huggingface.py push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
