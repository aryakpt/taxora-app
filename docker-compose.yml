# Local development dependencies only. The API and frontend run natively (see README).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: taxora
      POSTGRES_PASSWORD: taxora  # local development only
      POSTGRES_DB: taxora
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - taxora_pg:/var/lib/postgresql/data
      - ./backend/tests/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro  # creates taxora_test for pytest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxora -d taxora"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  taxora_pg:
