services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: taxora
      POSTGRES_PASSWORD: taxora
      POSTGRES_DB: taxora
    ports:
      - "5432:5432"
    volumes:
      - taxora_pg:/var/lib/postgresql/data
  api:
    build: .
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://taxora:taxora@db:5432/taxora
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  taxora_pg:
