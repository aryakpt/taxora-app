# Render Blueprint for the Taxora API (backend/). The database and file storage are on Supabase; the frontend
# is on Vercel, which forwards /api/* here (frontend/vercel.json). Secrets are marked `sync: false`: Render asks
# for them once, or they are set with `make deploy-env` from deploy/.env.production. See README "Deployment".
services:
  - type: web
    name: taxora-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: lax
      - key: TRUSTED_PROXY_HOPS
        value: "2"
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_FALLBACK_MODELS
        value: '["gemini-3.8-flash"]'
      - key: LLM_DATA_POLICY
        value: no_training
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIMENSIONS
        value: "768"
      - key: MAX_UPLOAD_BYTES
        value: "31457280"
      - key: SUPABASE_STORAGE_BUCKET
        value: documents
      # Secrets and per-deployment values
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
